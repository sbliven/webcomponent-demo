<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Component Demo</title>
  <link rel="stylesheet" href="main.css">
  <script type="module" src="timer-component.js" defer></script>
</head>
<body>
  <header>
    <h1>Web Component Demo</h1>
  </header>
  <main>
    <p>Welcome to the Web Component Demo. This is a simple example of a website layout using HTML and CSS.</p>

    <h2>Timers</h2>
    <h3>With controls</h3>
    <timer-component duration="5">
      <template>
        <label>Timer: </label>
        <div class="timer">Not set</div>
        <div id="controls">
          <button id="start">Start</button>
          <button id="reset">Reset</button>
          <button id="stop">Stop</button>
        </div>
      </template>
    </timer-component>
    <h3>Without controls</h3>
    <timer-component duration="30"></timer-component>

  </main>
</body>
</html>
